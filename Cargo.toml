[package]
name = "attendance-service"
version = "0.1.0"
edition = "2024"
default-run = "attendance-service"

[dependencies]
aide = { version = "0.15.1", features = ["axum-json", "macros", "scalar"] }
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
indoc = "2.0.7"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
regex = "1.13.1"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["chrono", "macros", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "full"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
